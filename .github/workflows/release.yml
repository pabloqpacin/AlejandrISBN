# Release — build & push to GHCR on version tags (draft)
#
# Uso:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Imagen publicada:
#   ghcr.io/<owner>/<repo>:latest
#   ghcr.io/<owner>/<repo>:1.0.0
#   ghcr.io/<owner>/<repo>:sha-<short>
#
# En GitHub → Settings → Packages: el paquete suele ser público si el repo lo es.
# Si el paquete queda privado, en la máquina del usuario haría falta `docker login ghcr.io`.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (lowercase)
        id: meta
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          IMAGE="ghcr.io/${OWNER,,}/${REPO,,}"
          TAG="${GITHUB_REF_NAME#v}"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Self-hosting

            Guía Windows (usuarios no técnicos): ver `docs/SELFHOSTING.md` en el tag.

            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd ${{ github.event.repository.name }}
            git checkout ${{ github.ref_name }}
            cp .env.example .env
            docker compose up --build -d
            ```

            Abre http://localhost:8000

            ### Imagen preconstruida (opcional)

            ```text
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ```
