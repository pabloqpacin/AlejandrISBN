<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AlejandrISBN — Inventario</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("alejandrisbn-theme");
        const theme = saved === "dark" || saved === "light"
          ? saved
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css?v=20260803r" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">
    <span class="icon-moon" aria-hidden="true">◐</span>
    <span class="icon-sun" aria-hidden="true">◑</span>
  </button>

  <header class="hero">
    <h1 class="brand">AlejandrISBN</h1>
    <p class="lede" id="hero-lede">Inventario lean de biblioteca y multimedia.</p>

    <form id="lookup-form" class="add-form lookup-only" autocomplete="off">
      <label class="field">
        <span>ISBN</span>
        <input
          id="isbn-input"
          name="isbn"
          type="text"
          inputmode="numeric"
          placeholder="9780143127550"
          required
          maxlength="17"
        />
      </label>
      <div class="add-actions">
        <button type="submit" class="btn primary" id="lookup-btn">Buscar ISBN</button>
        <button type="button" class="btn ghost" id="manual-btn">Sin ISBN</button>
      </div>
    </form>
    <div id="manual-only-actions" class="add-actions manual-only-actions hidden">
      <button type="button" class="btn primary" id="add-manual-media-btn">Añadir</button>
    </div>
    <p id="form-status" class="status" role="status" aria-live="polite"></p>
  </header>

  <nav class="catalog-nav" id="catalog-nav" aria-label="Categorías">
    <button type="button" class="catalog-tab active" data-tab="overview">Resumen</button>
    <button type="button" class="catalog-tab" data-tab="all">Todos</button>
    <button type="button" class="catalog-tab" data-tab="book">Libros</button>
    <button type="button" class="catalog-tab" data-tab="magazine">Revistas</button>
    <button type="button" class="catalog-tab" data-tab="cd">CDs</button>
    <button type="button" class="catalog-tab" data-tab="dvd">DVDs</button>
    <button type="button" class="catalog-tab" data-tab="vhs">VHS</button>
    <button type="button" class="catalog-tab" data-tab="cassette">Cassettes</button>
  </nav>

  <section id="overview-panel" class="overview-panel">
    <div class="overview-head">
      <h2>Resumen</h2>
      <p id="overview-total" class="list-meta"></p>
    </div>
    <div class="overview-grid">
      <div class="overview-block">
        <h3>Por tipo</h3>
        <ul id="overview-by-type" class="overview-list"></ul>
      </div>
      <div class="overview-block">
        <h3>Por ubicación</h3>
        <ul id="overview-by-room" class="overview-list"></ul>
      </div>
    </div>
  </section>

  <main class="inventory hidden" id="inventory-panel" hidden>
    <div class="inventory-head">
      <div>
        <h2 id="inventory-title">Inventario</h2>
        <p id="list-meta" class="list-meta"></p>
      </div>
      <div class="inventory-tools">
        <label class="search">
          <span class="visually-hidden">Buscar</span>
          <input
            id="search-input"
            type="search"
            placeholder="Buscar… Enter fija término (varios = OR)"
            title="Escribe y pulsa Enter para fijar un término. Varios términos se combinan con OR. Separados por coma también."
          />
        </label>
        <button type="button" id="clear-search" class="btn ghost compact hidden">Limpiar</button>
        <div class="export-menu import-menu">
          <button type="button" class="btn ghost compact export-trigger" aria-haspopup="true" aria-expanded="false">
            Importar
          </button>
          <div class="export-options" role="menu">
            <button type="button" class="export-option" data-import="json" role="menuitem">JSON</button>
            <button type="button" class="export-option" data-import="csv" role="menuitem">CSV</button>
          </div>
        </div>
        <input type="file" id="import-file" accept=".json,.csv,application/json,text/csv" hidden />
        <div class="export-menu">
          <button type="button" class="btn ghost compact export-trigger" aria-haspopup="true" aria-expanded="false">
            Exportar
          </button>
          <div class="export-options" role="menu">
            <button type="button" class="export-option" data-export="json" role="menuitem">JSON</button>
            <button type="button" class="export-option" data-export="csv" role="menuitem">CSV</button>
          </div>
        </div>
      </div>
    </div>

    <div id="view-chips" class="view-chips" hidden></div>

    <div id="batch-bar" class="batch-bar hidden" hidden>
      <span id="batch-count" class="batch-count">0 seleccionados</span>
      <div class="batch-actions">
        <button type="button" class="btn ghost compact" id="batch-location">Modificar campo</button>
        <button type="button" class="btn ghost compact" id="batch-enrich" title="Solo si faltan título, autor, año o editorial (y hay ISBN)">Completar online</button>
        <button type="button" class="btn danger compact" id="batch-delete">Eliminar</button>
      </div>
    </div>

    <div class="table-wrap">
      <table class="inventory-table" id="inventory-table" aria-label="Inventario">
        <thead>
          <tr>
            <th scope="col" class="col-select">
              <input type="checkbox" id="select-all-visible" title="Seleccionar visibles" aria-label="Seleccionar filas visibles" />
            </th>
            <th scope="col" class="col-fav">
              <div class="th-cell">
                <button type="button" class="sort-btn" data-sort="favourite" title="Ordenar por favorito">★</button>
                <button type="button" class="group-toggle" data-group="favourite" title="Añadir/quitar agrupación por favorito" aria-pressed="false">▦</button>
              </div>
            </th>
            <th scope="col" class="col-cover" aria-hidden="true"></th>
            <th scope="col"><button type="button" class="sort-btn" data-sort="title">Título</button></th>
            <th scope="col">
              <div class="th-cell">
                <button type="button" class="sort-btn" data-sort="authors" id="sort-authors-label">Autor</button>
                <button type="button" class="group-toggle" data-group="authors" title="Añadir/quitar agrupación" aria-pressed="false">▦</button>
              </div>
            </th>
            <th scope="col" class="col-year"><button type="button" class="sort-btn" data-sort="publication_year">Año</button></th>
            <th scope="col" class="col-isbn col-print"><button type="button" class="sort-btn" data-sort="isbn">ISBN</button></th>
            <th scope="col" class="col-dl col-print"><button type="button" class="sort-btn" data-sort="legal_deposit">DL</button></th>
            <th scope="col">
              <div class="th-cell">
                <button type="button" class="sort-btn" data-sort="genre">Género</button>
                <button type="button" class="group-toggle" data-group="genre" title="Añadir/quitar agrupación por género" aria-pressed="false">▦</button>
              </div>
            </th>
            <th scope="col" class="col-room">
              <div class="th-cell">
                <button type="button" class="sort-btn" data-sort="room">Habitación</button>
                <button type="button" class="group-toggle" data-group="room" title="Añadir/quitar agrupación por habitación" aria-pressed="false">▦</button>
              </div>
            </th>
            <th scope="col" class="col-furniture">
              <div class="th-cell">
                <button type="button" class="sort-btn" data-sort="furniture">Mueble</button>
                <button type="button" class="group-toggle" data-group="furniture" title="Añadir/quitar agrupación por mueble" aria-pressed="false">▦</button>
              </div>
            </th>
            <th scope="col">
              <div class="th-cell">
                <button type="button" class="sort-btn" data-sort="publisher" id="sort-publisher-label">Editorial</button>
                <button type="button" class="group-toggle" data-group="publisher" title="Añadir/quitar agrupación" aria-pressed="false">▦</button>
              </div>
            </th>
            <th scope="col">
              <div class="th-cell">
                <button type="button" class="sort-btn" data-sort="collection">Colección</button>
                <button type="button" class="group-toggle" data-group="collection" title="Añadir/quitar agrupación por colección" aria-pressed="false">▦</button>
              </div>
            </th>
            <th scope="col"><button type="button" class="sort-btn" data-sort="notes">Notas</button></th>
            <th scope="col" class="col-actions"><span class="visually-hidden">Acciones</span></th>
          </tr>
        </thead>
        <tbody id="book-tbody"></tbody>
      </table>
    </div>

    <p id="empty-state" class="empty hidden">Aún no hay ítems en esta categoría.</p>
  </main>

  <dialog id="batch-dialog" class="detail-dialog">
    <div class="detail-sheet batch-sheet">
      <button type="button" class="detail-close" id="batch-close" aria-label="Cerrar">×</button>
      <div id="batch-body"></div>
    </div>
  </dialog>

  <dialog id="enrich-dialog" class="detail-dialog enrich-dialog">
    <div class="detail-sheet enrich-sheet">
      <button type="button" class="detail-close" id="enrich-close" aria-label="Cerrar">×</button>
      <div id="enrich-body"></div>
    </div>
  </dialog>

  <dialog id="review-dialog" class="detail-dialog">
    <div class="detail-sheet review-sheet">
      <button type="button" class="detail-close" id="review-close" aria-label="Cerrar">×</button>
      <div id="review-body"></div>
    </div>
  </dialog>

  <dialog id="detail-dialog" class="detail-dialog">
    <div class="detail-sheet">
      <button type="button" class="detail-close" id="detail-close" aria-label="Cerrar">×</button>
      <div id="detail-body"></div>
    </div>
  </dialog>

  <script src="/static/js/app.js?v=20260803s" type="module"></script>
</body>
</html>
