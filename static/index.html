<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AlejandrISBN — Inventario de biblioteca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <header class="hero">
    <p class="mark">TM</p>
    <h1 class="brand">AlejandrISBN</h1>
    <p class="lede">Inventario lean de biblioteca. Guarda por ISBN; el catálogo se completa solo.</p>

    <form id="add-form" class="add-form" autocomplete="off">
      <label class="field">
        <span>ISBN</span>
        <input
          id="isbn-input"
          name="isbn"
          type="text"
          inputmode="numeric"
          placeholder="9780143127550"
          required
          maxlength="17"
        />
      </label>
      <label class="field notes-field">
        <span>Notas</span>
        <input id="notes-input" name="notes" type="text" placeholder="Estantería B2, donación…" />
      </label>
      <button type="submit" class="btn primary" id="add-btn">Añadir al inventario</button>
    </form>
    <p id="form-status" class="status" role="status" aria-live="polite"></p>
  </header>

  <main class="inventory">
    <div class="inventory-head">
      <h2>Inventario</h2>
      <label class="search">
        <span class="visually-hidden">Buscar</span>
        <input
          id="search-input"
          type="search"
          placeholder="Buscar título, autor, ISBN, género…"
        />
      </label>
    </div>

    <p id="list-meta" class="list-meta"></p>
    <ul id="book-list" class="book-list"></ul>
    <p id="empty-state" class="empty hidden">Aún no hay libros. Añade el primero con su ISBN.</p>
  </main>

  <dialog id="detail-dialog" class="detail-dialog">
    <form method="dialog" class="detail-sheet">
      <button value="close" class="detail-close" aria-label="Cerrar">×</button>
      <div id="detail-body"></div>
    </form>
  </dialog>

  <script src="/static/js/app.js" type="module"></script>
</body>
</html>
