<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AlejandrISBN — Inventario de biblioteca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <header class="hero">
    <p class="mark">TM</p>
    <h1 class="brand">AlejandrISBN</h1>
    <p class="lede">Inventario lean de biblioteca. Busca por ISBN, revisa los datos y guarda.</p>

    <form id="lookup-form" class="add-form lookup-only" autocomplete="off">
      <label class="field">
        <span>ISBN</span>
        <input
          id="isbn-input"
          name="isbn"
          type="text"
          inputmode="numeric"
          placeholder="9780143127550"
          required
          maxlength="17"
        />
      </label>
      <button type="submit" class="btn primary" id="lookup-btn">Buscar ISBN</button>
    </form>
    <p id="form-status" class="status" role="status" aria-live="polite"></p>
  </header>

  <main class="inventory">
    <div class="inventory-head">
      <div>
        <h2>Inventario</h2>
        <p id="list-meta" class="list-meta"></p>
      </div>
      <div class="inventory-tools">
        <label class="search">
          <span class="visually-hidden">Buscar</span>
          <input
            id="search-input"
            type="search"
            placeholder="Buscar título, autor, ISBN, género, ubicación…"
          />
        </label>
        <button type="button" id="clear-search" class="btn ghost compact hidden">Limpiar</button>
        <button type="button" id="export-btn" class="btn ghost compact">Exportar JSON</button>
      </div>
    </div>

    <div class="table-wrap">
      <table class="inventory-table" aria-label="Inventario de libros">
        <thead>
          <tr>
            <th scope="col" class="col-cover" aria-hidden="true"></th>
            <th scope="col"><button type="button" class="sort-btn" data-sort="title">Título</button></th>
            <th scope="col"><button type="button" class="sort-btn" data-sort="authors">Autor</button></th>
            <th scope="col" class="col-year"><button type="button" class="sort-btn" data-sort="publication_year">Año</button></th>
            <th scope="col" class="col-isbn"><button type="button" class="sort-btn" data-sort="isbn">ISBN</button></th>
            <th scope="col"><button type="button" class="sort-btn" data-sort="genre">Género</button></th>
            <th scope="col" class="col-location"><button type="button" class="sort-btn" data-sort="location">Ubicación</button></th>
            <th scope="col"><button type="button" class="sort-btn" data-sort="publisher">Editorial</button></th>
            <th scope="col"><button type="button" class="sort-btn" data-sort="notes">Notas</button></th>
            <th scope="col" class="col-actions"><span class="visually-hidden">Acciones</span></th>
          </tr>
        </thead>
        <tbody id="book-tbody"></tbody>
      </table>
    </div>

    <p id="empty-state" class="empty hidden">Aún no hay libros. Añade el primero con su ISBN.</p>
  </main>

  <dialog id="review-dialog" class="detail-dialog">
    <div class="detail-sheet review-sheet">
      <button type="button" class="detail-close" id="review-close" aria-label="Cerrar">×</button>
      <div id="review-body"></div>
    </div>
  </dialog>

  <dialog id="detail-dialog" class="detail-dialog">
    <div class="detail-sheet">
      <button type="button" class="detail-close" id="detail-close" aria-label="Cerrar">×</button>
      <div id="detail-body"></div>
    </div>
  </dialog>

  <script src="/static/js/app.js" type="module"></script>
</body>
</html>
