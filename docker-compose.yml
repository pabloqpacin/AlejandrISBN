services:
  db:
    image: postgres:16-alpine
    container_name: alejandrisbn-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alejandrisbn}
      POSTGRES_USER: ${POSTGRES_USER:-alejandrisbn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alejandrisbn}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # App = API FastAPI + UI estática (mismo contenedor).
  # Dev/self-host: siempre `docker compose up --build -d` (o start.bat).
  # `up -d` solo NO rebuild; reusa la imagen local ya tageada.
  # Tag local a propósito (no ghcr.io/...:latest) para no pisar builds con un pull remoto.
  # Publicación a GHCR: workflow release.yml, no este compose.
  alejandrisbn:
    build: .
    image: alejandrisbn:local
    container_name: alejandrisbn
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-alejandrisbn}:${POSTGRES_PASSWORD:-alejandrisbn}@db:5432/${POSTGRES_DB:-alejandrisbn}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      SEED_DIR: /app/seed
    ports:
      - "8000:8000"
    volumes:
      - ./seed:/app/seed:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
    name: alejandrisbn_pgdata
